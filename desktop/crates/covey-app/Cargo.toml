[package]
name = "covey-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The covey desktop client: a character grid in a window, where a cell can be a picture."

[[bin]]
name = "covey-desktop"
path = "src/main.rs"

[dependencies]
covey-protocol.workspace = true
covey-client.workspace = true
covey-grid.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
eframe = "0.32"
egui = "0.32"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ab_glyph = "0.2"
uuid = { version = "1", features = ["v4"] }
