/*
 * The *supported* way to build a local Expo module, and not a hand-rolled
 * `kotlin-android` setup.
 *
 * `expo-module-gradle-plugin` is what pins the Kotlin version to the one
 * `expo-modules-core` was itself compiled with, and that is load-bearing rather
 * than tidiness. The module DSL takes its argument and return types through
 * *reified* type parameters, which only exist while the compiler inlines them —
 * compile against a different Kotlin and the reification marker survives into
 * the bytecode, so the first thing the app does with this module at launch is
 * throw:
 *
 *   java.lang.UnsupportedOperationException: This function has a reified type
 *   parameter and thus can only be inlined at compilation time
 *
 * That is thrown while the module registry is built, before any JavaScript
 * runs, so the app closes on launch with no error screen. It cost one release.
 * `Function` with no argument happens to survive the mistake, which is why
 * `modules/covey-link` has never shown it — it has no function that takes one.
 */
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'farm.dylan.covey.keys'
version = '0.1.0'

android {
  namespace "farm.dylan.covey.keys"
  // `versionName` is the one the plugin asks for by name: it publishes the
  // module as a library unless told otherwise, and `PublicationInfo` requires
  // it. `versionCode` is not required — it is the house style of expo's own
  // modules, and this file is one the next person copies.
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}
