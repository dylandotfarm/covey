name: ci
# `merge_group` is required for the merge queue: GitHub runs the checks on the
# queued merge result, not on the pull request branch. Without this trigger a
# queued pull request waits for a check that never starts.
on: [push, pull_request, merge_group]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json → packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: dependency age policy (7 days), npm
        run: node scripts/pkg-age.mjs check
      # The crate audit lives here rather than in the `desktop` job because it
      # reads desktop/Cargo.lock and needs node, not cargo. On a stable
      # toolchain below Rust 1.100 it is the only thing enforcing the rule for
      # crates — see scripts/crate-age.mjs.
      - name: dependency age policy (7 days), crates
        run: node scripts/crate-age.mjs check
      - run: pnpm run build
      - run: pnpm test
  # The Rust desktop client (issue #142). Its own job because it is its own
  # workspace: `tsc -b` never sees it and `cargo` never needs node. A red job
  # here does not say the TUI is broken, and the other way round.
  # The React Native client (issue #168). Its own job because it is its own pnpm
  # workspace: `tsc -b` never sees it, and its install rules are not the ones
  # written for a node project. A red job here does not say the TUI is broken.
  #
  # `pnpm run export` is the point of this job. It is the only thing that proves
  # Metro still resolves `@covey/client`, `@covey/protocol` and `@covey/web` from
  # outside the workspace, and that resolution is the whole bet of a third client
  # that shares its logic. A typecheck cannot see it: the bundler never reads a
  # tsconfig.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The app bundles what `tsc -b` wrote, so the workspace above is built
      # first. Nothing here needs its tests.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # `--frozen-lockfile` is what holds the 7-day rule here: pnpm verifies the
      # lockfile against `minimumReleaseAge` in mobile/pnpm-workspace.yaml, so a
      # version the policy never saw cannot enter. There is no separate audit
      # script for this workspace and it does not need one.
      - run: pnpm install --frozen-lockfile
        working-directory: mobile
      - run: pnpm run typecheck
        working-directory: mobile
      - run: pnpm test
        working-directory: mobile
      - run: pnpm run export
        working-directory: mobile

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # winit opens X11, Wayland and xkbcommon at run time rather than linking
      # them, so a build needs no display and no development packages. The
      # tests need neither: every one of them works on a grid, and the two that
      # want a font or `ffmpeg` step aside when the machine has none.
      # `--locked` everywhere: CI must never resolve a dependency. A version
      # that entered without the age audit seeing it is the hole this closes.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --bin covey-desktop
