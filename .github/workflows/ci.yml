name: ci
# `merge_group` is required for the merge queue: GitHub runs the checks on the
# queued merge result, not on the pull request branch. Without this trigger a
# queued pull request waits for a check that never starts.
on: [push, pull_request, merge_group]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json → packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: dependency age policy (7 days)
        run: node scripts/pkg-age.mjs check
      - run: pnpm run build
      - run: pnpm test
